services:

  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    env_file:
      - ./env/duckdns.env
    restart: unless-stopped

  smp:
    image: simplexchat/smp-server:latest
    container_name: simplex-smp
    env_file:
      - ./env/smp.env
    ports:
      - "5223:5223"
    command:
      sh -c 'until [ -s /certificates/$$ADDR.crt ] && [ -s /certificates/$$ADDR.key ]; do
        echo "waiting for TLS certificates to be available from ACME.sh";
        sleep 5;
        done;
        exec /usr/local/bin/entrypoint'
    volumes:
      - ./simplex/server/config:/etc/opt/simplex
      - ./simplex/server/state:/var/opt/simplex
      - ./coturn/certs:/certificates
    restart: unless-stopped

  xftp:
    image: simplexchat/xftp-server:latest
    container_name: simplex-xftp
    env_file:
      - ./env/xftp.env
    ports:
      - "443:443"
    volumes:
      - ./simplex/file-transfer/config:/etc/opt/simplex-xftp
      - ./simplex/file-transfer/state:/var/opt/simplex-xftp
      - ./simplex/file-transfer/files:/srv/xftp
    restart: unless-stopped

  coturn:
    image: coturn/coturn
    container_name: coturn
    env_file:
      - ./env/coturn.env
    network_mode: host
    volumes:
      - ./coturn/certs:/certs
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf
    restart: unless-stopped

  acme:
    image: neilpang/acme.sh:latest
    container_name: acme
    env_file:
      - ./env/acme.env
    entrypoint: >
      sh -c ' acme.sh --register-account -m "$$EMAIL" || true; 
        while true; do
          if acme.sh --issue --force --dns dns_duckdns -d "$$DOMAIN" --keylength 4096 --key-file rsa; then 
            acme.sh --install-cert -d "$$DOMAIN" --fullchain-file /certificates/$$DOMAIN.crt --key-file /certificates/$$DOMAIN.key; echo "Sleeping before renewal cycle"; sleep 12h;
          else
            echo "Certificate issuing process failed. Retry in 2 minutes"
            sleep 120;
          fi
        done
      '
    volumes:
      - ./acme/account:/acme.sh
      - ./coturn/certs:/certificates
      - ./coturn/hooks:/hooks
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - --cleanup
      - --interval
      - "86400"
    restart: unless-stopped
